<style>
:root{--paie-navy:#123c69;--paie-blue:#1d6fa5;--paie-bg:#eef3f8;--paie-line:#d8e3ed}
body[data-standalone-module="paie"]{margin:0;background:var(--paie-bg);color:#10243e}
.paie-standalone-shell{height:100vh;display:flex;flex-direction:column;background:var(--paie-bg)}
.paie-standalone-header{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 28px;background:linear-gradient(135deg,var(--paie-navy),var(--paie-blue));color:#fff;box-shadow:0 8px 24px rgba(18,60,105,.22)}
.paie-brand{display:flex;align-items:center;gap:13px}.paie-brand-mark{width:52px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);font-size:12px;font-weight:950}.paie-brand h1{font-size:20px;letter-spacing:.1em;margin:0}.paie-brand small{display:block;opacity:.8;margin-top:2px}
.paie-header-context{text-align:right;font-size:12px}.paie-header-context strong{display:block;font-size:14px;margin-bottom:5px}.paie-header-actions{display:flex;gap:8px;justify-content:flex-end}.paie-header-actions button{border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}
.paie-standalone-body{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0}.paie-nav{background:#fff;border-right:1px solid var(--paie-line);padding:18px 12px;overflow:auto}.paie-nav-title{padding:0 10px 12px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#64748b;text-transform:uppercase}.paie-nav-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#334e68;border-radius:11px;padding:11px 12px;margin:3px 0;text-align:left;font-size:12px;font-weight:850;cursor:pointer}.paie-nav-link:hover{background:#eff6ff;color:var(--paie-blue)}.paie-nav-link.active{background:var(--paie-navy);color:#fff;box-shadow:0 6px 16px rgba(18,60,105,.2)}.paie-nav-icon{font-size:16px;width:21px;text-align:center}
.paie-main{min-width:0;overflow:hidden;display:flex;flex-direction:column}.paie-main-head{padding:15px 24px 5px;display:flex;align-items:center;justify-content:space-between;gap:12px}.paie-main-head h2{margin:0;font-size:18px;color:var(--paie-navy)}.paie-main-head span{font-size:12px;color:#64748b}.paie-main #view{padding:14px 24px 28px;overflow:auto;flex:1}
body[data-standalone-module="paie"] .btn-primary{background:var(--paie-navy)!important;border-color:var(--paie-navy)!important}
.paie-login-page{min-height:100vh;display:grid;grid-template-columns:minmax(420px,1.15fr) minmax(420px,.85fr);background:#eef5f7;color:#10243e;overflow:hidden}
.paie-login-brand-panel{position:relative;padding:64px clamp(42px,7vw,110px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#082f49 0%,#0f5f67 58%,#15847c 100%);color:#fff;overflow:hidden}
.paie-login-brand-panel:before,.paie-login-brand-panel:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.paie-login-brand-panel:before{width:580px;height:580px;right:-230px;top:-190px}.paie-login-brand-panel:after{width:380px;height:380px;left:-180px;bottom:-210px}
.paie-login-brand-content{position:relative;z-index:1;max-width:650px}.paie-login-logo{display:flex;align-items:center;gap:16px;margin-bottom:48px}.paie-login-logo-mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);font-size:16px;font-weight:950;letter-spacing:.06em}.paie-login-logo strong{display:block;font-size:22px;letter-spacing:.12em}.paie-login-logo span{display:block;margin-top:3px;font-size:12px;opacity:.76}
.paie-login-brand-panel h1{font-size:clamp(40px,5vw,72px);line-height:1.02;margin:0 0 20px;letter-spacing:-.04em}.paie-login-brand-panel h1 span{color:#7ee8d5}.paie-login-lead{font-size:18px;line-height:1.6;max-width:560px;color:#d8f1ef;margin:0 0 38px}.paie-login-features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.paie-login-feature{padding:16px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16)}.paie-login-feature b{display:block;font-size:13px;margin-bottom:4px}.paie-login-feature span{font-size:11px;line-height:1.4;color:#c5e5e2}
.paie-login-access-panel{display:flex;align-items:center;justify-content:center;padding:42px;background:radial-gradient(circle at 100% 0,#d8eff0 0,transparent 42%)}.paie-login-card{width:100%;max-width:470px;background:#fff;border:1px solid #dce8ed;border-radius:26px;padding:38px;box-shadow:0 26px 70px rgba(8,47,73,.16)}.paie-login-chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 11px;background:#e6f7f4;color:#0f766e;font-size:11px;font-weight:900}.paie-login-chip:before{content:"";width:7px;height:7px;border-radius:50%;background:#10b981}.paie-login-card h2{font-size:34px;margin:18px 0 7px;color:#0f2940}.paie-login-card-sub{font-size:14px;color:#64748b;margin:0 0 28px}.paie-login-form{display:flex;flex-direction:column;gap:14px}.paie-login-field{display:block;margin:0;text-transform:none;letter-spacing:0}.paie-login-field>span{display:block;margin:0 0 6px;font-size:11px;font-weight:850;color:#52677b}.paie-login-input-wrap{position:relative}.paie-login-input-wrap input{height:52px;border:1px solid #ccdae4;border-radius:13px;padding:0 14px;font-size:14px}.paie-login-input-wrap input:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.12)}.paie-login-password-toggle{position:absolute;right:9px;top:9px;height:34px;border:0;border-radius:9px;background:#e8f3f5;color:#0f5f67;padding:0 11px;font-size:11px;font-weight:850;cursor:pointer}.paie-login-remember{display:flex;align-items:center;gap:8px;margin:2px 0 0;color:#64748b;font-size:12px;font-weight:750;text-transform:none;letter-spacing:0}.paie-login-remember input{width:16px;height:16px;accent-color:#0f766e}.paie-login-submit{width:100%;height:52px;margin-top:18px;border:0;border-radius:13px;background:linear-gradient(135deg,#0f5f67,#0f766e);color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 12px 26px rgba(15,118,110,.25)}.paie-login-submit:disabled{opacity:.7;cursor:wait}.paie-login-status{margin-top:11px;text-align:center;font-size:12px;color:#0f766e;font-weight:800}.paie-login-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:17px;border-top:1px solid #edf2f5;font-size:11px;color:#718096}.paie-login-forgot{border:0;background:none;padding:0;color:#0f5f67;font-size:11px;font-weight:850;cursor:pointer}
@media(max-width:980px){.paie-login-page{grid-template-columns:1fr}.paie-login-brand-panel{padding:38px 28px}.paie-login-brand-panel h1{font-size:40px}.paie-login-lead{margin-bottom:0}.paie-login-features{display:none}.paie-login-logo{margin-bottom:28px}.paie-login-access-panel{padding:28px;align-items:flex-start}.paie-login-card{max-width:560px}}
@media(max-width:560px){.paie-login-brand-panel{padding:25px 20px}.paie-login-logo{margin-bottom:18px}.paie-login-logo-mark{width:48px;height:48px;border-radius:13px}.paie-login-brand-panel h1{font-size:32px;margin-bottom:10px}.paie-login-lead{font-size:14px}.paie-login-access-panel{padding:18px}.paie-login-card{padding:25px 20px;border-radius:20px}.paie-login-card h2{font-size:28px}}
@media(max-width:760px){.paie-standalone-header{padding:12px 15px;min-height:68px}.paie-brand small,.paie-header-context>strong{display:none}.paie-brand h1{font-size:16px}.paie-header-context{display:flex;align-items:center;gap:6px}.paie-header-actions button{font-size:0;padding:8px}.paie-header-actions button span{font-size:17px}.paie-standalone-body{display:flex;flex-direction:column}.paie-nav{display:flex;gap:6px;border-right:0;border-bottom:1px solid var(--paie-line);padding:8px;overflow-x:auto;flex:none}.paie-nav-title{display:none}.paie-nav-link{width:auto;white-space:nowrap;margin:0;padding:9px 11px}.paie-main-head{padding:12px 14px 2px}.paie-main #view{padding:10px 12px 24px}}
</style>
