<style>
:root{--paie-navy:#123c69;--paie-blue:#1d6fa5;--paie-bg:#eef3f8;--paie-line:#d8e3ed}
body[data-standalone-module="paie"]{margin:0;background:var(--paie-bg);color:#10243e}
.paie-standalone-shell{height:100vh;display:flex;flex-direction:column;background:var(--paie-bg)}
.paie-standalone-header{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 28px;background:linear-gradient(135deg,var(--paie-navy),var(--paie-blue));color:#fff;box-shadow:0 8px 24px rgba(18,60,105,.22)}
.paie-brand{display:flex;align-items:center;gap:13px}.paie-brand-mark{width:52px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);font-size:12px;font-weight:950}.paie-brand h1{font-size:20px;letter-spacing:.1em;margin:0}.paie-brand small{display:block;opacity:.8;margin-top:2px}
.paie-header-context{text-align:right;font-size:12px}.paie-header-context strong{display:block;font-size:14px;margin-bottom:5px}.paie-header-actions{display:flex;gap:8px;justify-content:flex-end}.paie-header-actions button{border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}
.paie-standalone-body{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0}.paie-nav{background:#fff;border-right:1px solid var(--paie-line);padding:18px 12px;overflow:auto}.paie-nav-title{padding:0 10px 12px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#64748b;text-transform:uppercase}.paie-nav-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#334e68;border-radius:11px;padding:11px 12px;margin:3px 0;text-align:left;font-size:12px;font-weight:850;cursor:pointer}.paie-nav-link:hover{background:#eff6ff;color:var(--paie-blue)}.paie-nav-link.active{background:var(--paie-navy);color:#fff;box-shadow:0 6px 16px rgba(18,60,105,.2)}.paie-nav-icon{font-size:16px;width:21px;text-align:center}
.paie-main{min-width:0;overflow:hidden;display:flex;flex-direction:column}.paie-main-head{padding:15px 24px 5px;display:flex;align-items:center;justify-content:space-between;gap:12px}.paie-main-head h2{margin:0;font-size:18px;color:var(--paie-navy)}.paie-main-head span{font-size:12px;color:#64748b}.paie-main #view{padding:14px 24px 28px;overflow:auto;flex:1}
body[data-standalone-module="paie"] .btn-primary{background:var(--paie-navy)!important;border-color:var(--paie-navy)!important}
@media(max-width:760px){.paie-standalone-header{padding:12px 15px;min-height:68px}.paie-brand small,.paie-header-context>strong{display:none}.paie-brand h1{font-size:16px}.paie-header-context{display:flex;align-items:center;gap:6px}.paie-header-actions button{font-size:0;padding:8px}.paie-header-actions button span{font-size:17px}.paie-standalone-body{display:flex;flex-direction:column}.paie-nav{display:flex;gap:6px;border-right:0;border-bottom:1px solid var(--paie-line);padding:8px;overflow-x:auto;flex:none}.paie-nav-title{display:none}.paie-nav-link{width:auto;white-space:nowrap;margin:0;padding:9px 11px}.paie-main-head{padding:12px 14px 2px}.paie-main #view{padding:10px 12px 24px}}
</style>
<script>window.__PAIE_AUTONOMOUS_APP__=true;</script>
