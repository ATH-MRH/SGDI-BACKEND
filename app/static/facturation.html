<style>
:root{--fac-navy:#073b4c;--fac-green:#0f766e;--fac-bg:#f1f5f9;--fac-line:#dbe4ea}
body[data-standalone-module="facturation"]{margin:0;background:var(--fac-bg);color:#102a43}
.fac-standalone-shell{height:100vh;display:flex;flex-direction:column;background:var(--fac-bg)}
.fac-standalone-header{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 28px;background:linear-gradient(135deg,var(--fac-navy),var(--fac-green));color:#fff;box-shadow:0 8px 24px rgba(7,59,76,.22)}
.fac-brand{display:flex;align-items:center;gap:13px}.fac-brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);font-weight:950}.fac-brand h1{font-size:20px;letter-spacing:.07em;margin:0}.fac-brand small{display:block;opacity:.78;margin-top:2px}
.fac-header-context{text-align:right;font-size:12px}.fac-header-context strong{display:block;font-size:14px;margin-bottom:5px}.fac-header-actions{display:flex;gap:8px;justify-content:flex-end}.fac-header-actions button{border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}
.fac-standalone-body{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1;min-height:0}.fac-nav{background:#fff;border-right:1px solid var(--fac-line);padding:18px 12px;overflow:auto}.fac-nav-title{padding:0 10px 12px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#64748b;text-transform:uppercase}.fac-nav-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#334e68;border-radius:11px;padding:11px 12px;margin:3px 0;text-align:left;font-size:12px;font-weight:850;cursor:pointer}.fac-nav-link:hover{background:#ecfdf5;color:#0f766e}.fac-nav-link.active{background:#0f766e;color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.2)}.fac-nav-icon{font-size:16px;width:21px;text-align:center}
.fac-main{min-width:0;overflow:hidden;display:flex;flex-direction:column}.fac-main-head{padding:15px 24px 5px;display:flex;align-items:center;justify-content:space-between;gap:12px}.fac-main-head h2{margin:0;font-size:18px;color:#073b4c}.fac-main-head span{font-size:12px;color:#64748b}.fac-main #view{padding:14px 24px 28px;overflow:auto;flex:1}
@media(max-width:760px){.fac-standalone-header{padding:12px 15px;min-height:68px}.fac-brand small,.fac-header-context>strong{display:none}.fac-brand h1{font-size:16px}.fac-header-context{display:flex;align-items:center;gap:6px}.fac-header-actions button{font-size:0;padding:8px}.fac-header-actions button span{font-size:17px}.fac-standalone-body{display:flex;flex-direction:column}.fac-nav{display:flex;gap:6px;border-right:0;border-bottom:1px solid var(--fac-line);padding:8px;overflow-x:auto;flex:none}.fac-nav-title{display:none}.fac-nav-link{width:auto;white-space:nowrap;margin:0;padding:9px 11px}.fac-main-head{padding:12px 14px 2px}.fac-main #view{padding:10px 12px 24px}}
</style>
<script>
window.__FAC_AUTONOMOUS_APP__=true;
window.sgdiLoadXLSX=function(){return window._xlsxLoaded?Promise.resolve():new Promise((res,rej)=>{if(window.XLSX){window._xlsxLoaded=true;return res()}const s=document.createElement('script');s.src='/static/xlsx.full.min.js?v=1';s.onload=()=>{window._xlsxLoaded=true;res()};s.onerror=rej;document.head.appendChild(s)})};
window.sgdiLoadQRLib=function(){return window._qrLoaded?Promise.resolve():new Promise((res,rej)=>{if(window.QRCode){window._qrLoaded=true;return res()}const s=document.createElement('script');s.src='/static/qrcode.min.js?v=1';s.onload=()=>{window._qrLoaded=true;res()};s.onerror=rej;document.head.appendChild(s)})};
window.sgdiLoadHtml5QR=function(){return window._h5qrLoaded?Promise.resolve():new Promise((res,rej)=>{if(window.Html5Qrcode){window._h5qrLoaded=true;return res()}const s=document.createElement('script');s.src='/static/html5-qrcode.min.js?v=1';s.onload=()=>{window._h5qrLoaded=true;res()};s.onerror=rej;document.head.appendChild(s)})};
</script>
