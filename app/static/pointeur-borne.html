<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1d33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Borne de pointage ATLAS</title>
<link rel="manifest" href="/pointeur-borne.webmanifest">
<link rel="icon" href="/static/sgdi-icon-192.png">
<style>
  :root { --bg: #0b1d33; --panel: rgba(8, 20, 38, .86); --ink: #f4f7fb; --muted: #a9b8cc; --ok: #19a35b; --warn: #d99a14; --err: #d64545; --work: #2f7fd8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .kiosk { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .kiosk-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; font-size: clamp(13px, 1.8vw, 18px); color: var(--muted); }
  .kiosk-bar b { color: var(--ink); letter-spacing: .08em; }
  .kiosk-prod { border: 1px solid var(--muted); border-radius: 999px; padding: 2px 10px; font-size: .85em; white-space: nowrap; }
  .kiosk-stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  #kioskVideo { width: 100%; height: 100%; max-height: 100%; object-fit: cover; border-radius: 18px; background: #000; transform: scaleX(-1); }
  .kiosk-frame { position: absolute; top: 8%; height: 84%; max-width: 72%; aspect-ratio: 3 / 4; border: 4px solid rgba(255, 255, 255, .55); border-radius: 50% / 42%; pointer-events: none; }
  .kiosk-status { margin: 12px 16px 16px; padding: clamp(14px, 2.6vh, 28px) 18px; border-radius: 18px; background: var(--panel); text-align: center; border-top: 8px solid var(--muted); min-height: 22vh;
    display: flex; flex-direction: column; justify-content: center; }
  .kiosk-title { font-size: clamp(26px, 5.2vw, 64px); font-weight: 800; letter-spacing: .02em; line-height: 1.1; overflow-wrap: anywhere; }
  .kiosk-detail { margin-top: 10px; font-size: clamp(16px, 2.6vw, 30px); color: var(--muted); overflow-wrap: anywhere; }
  .kiosk-verb { margin-top: 12px; font-size: clamp(24px, 4.6vw, 56px); font-weight: 800; color: var(--ink); }
  .tone-ok { border-top-color: var(--ok); } .tone-ok .kiosk-title { color: #7ff0b0; }
  .tone-warn { border-top-color: var(--warn); } .tone-error { border-top-color: var(--err); } .tone-work { border-top-color: var(--work); }
  .kiosk-pairing { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 16px; z-index: 10; }
  .kiosk-pairing[hidden] { display: none; }
  .kiosk-pairing form { width: min(520px, 100%); display: grid; gap: 14px; background: var(--panel); padding: 22px; border-radius: 18px; }
  .kiosk-pairing h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
  .kiosk-pairing p { margin: 0; color: var(--muted); }
  .kiosk-pairing input, .kiosk-pairing select, .kiosk-pairing button { font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 1px solid #36506f; background: #0f2744; color: var(--ink); width: 100%; }
  .kiosk-pairing input { letter-spacing: .18em; text-transform: uppercase; text-align: center; }
  .kiosk-pairing button { background: var(--work); border: 0; font-weight: 700; }
  #pairMessage { color: #ffb3b3; min-height: 1.2em; }
  /* Prise de photo distante supervisée : le terminal indique clairement qu'il n'est pas en pointage. */
  .kiosk-mode { background: var(--warn); color: #1b1300; border-radius: 999px; padding: 3px 12px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
  .kiosk-mode[hidden] { display: none; }
  body.kiosk-capturing .kiosk-frame { border-color: var(--warn); }
</style>
</head>
<body>
<main class="kiosk" aria-live="polite">
  <header class="kiosk-bar"><span><b>ATLAS</b> · Borne de pointage</span><span id="kioskSite"></span><span id="kioskMode" class="kiosk-mode" hidden></span><span class="kiosk-prod">PRODUCTION</span></header>
  <section class="kiosk-stage">
    <video id="kioskVideo" autoplay playsinline muted></video>
    <div class="kiosk-frame" aria-hidden="true"></div>
  </section>
  <section id="kioskStatus" class="kiosk-status tone-idle" data-state="BOOT"><div class="kiosk-title">DÉMARRAGE…</div></section>
</main>
<div id="kioskPairing" class="kiosk-pairing" hidden>
  <form id="pairForm" autocomplete="off">
    <h1>Association de la borne</h1>
    <p>Réservé à l'administrateur : saisissez le code à usage unique affiché dans ATLAS (Gestion du pointage → Terminaux). Une clé propre à cet appareil est créée ; elle ne quitte jamais la tablette.</p>
    <input id="pairCode" inputmode="text" maxlength="11" placeholder="XXXXX-XXXXX" aria-label="Code d'association" required>
    <select id="pairCamera" aria-label="Caméra"><option value="">Caméra frontale (par défaut)</option></select>
    <button id="pairSubmit" type="submit">Associer cette borne</button>
    <div id="pairMessage" role="alert"></div>
  </form>
</div>
<script src="/static/pointeur-borne.js?v=20261003-c1"></script>
</body>
</html>
