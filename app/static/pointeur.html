<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#043970">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pointeur ATLAS">
<title>POINTEUR — ATLAS</title>
<link rel="icon" href="/static/sgdi-icon-192.png">
<link rel="apple-touch-icon" href="/static/sgdi-icon-192.png">
<style>
:root{--navy:#043970;--blue:#0d6ecc;--green:#16a34a;--red:#dc2626;--amber:#d97706;--ink:#10243e;--muted:#64748b;--line:#dbe5f0;--bg:#edf3f8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
.hidden{display:none!important}
.login{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,#032f60,#0d6ecc)}
.login-card{width:100%;max-width:390px;background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.logo{width:72px;height:72px;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900}
h1{font-size:25px;text-align:center;margin:0}.login-sub{text-align:center;color:var(--muted);margin:7px 0 24px;font-size:14px}
label{display:block;font-size:12px;font-weight:800;color:#42566f;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;height:52px;border:1px solid var(--line);border-radius:13px;padding:0 14px;color:var(--ink);background:#fff;font-size:16px}
input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}
.primary{width:100%;border:0;border-radius:14px;background:var(--navy);color:#fff;padding:15px;font-weight:900;margin-top:18px;cursor:pointer}
.error{display:none;margin-top:13px;border-radius:11px;padding:11px;background:#fee2e2;color:#991b1b;font-size:13px;font-weight:700}
.error.show{display:block}
.app{min-height:100vh;padding-bottom:28px}
.top{background:linear-gradient(135deg,#043970,#0d6ecc);color:#fff;padding:max(18px,env(safe-area-inset-top)) 18px 19px;border-radius:0 0 24px 24px;box-shadow:0 10px 30px rgba(4,57,112,.25)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:520px;margin:auto}
.brand{display:flex;align-items:center;gap:11px}.brand-logo{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:900}
.brand-title{font-size:19px;font-weight:950;letter-spacing:.08em}.brand-user{font-size:12px;opacity:.8;margin-top:2px}
.logout{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 11px;font-weight:750}
.main{max-width:520px;margin:0 auto;padding:16px}
.status{display:flex;align-items:center;justify-content:center;gap:7px;background:#dcfce7;color:#166534;border:1px solid #bbf7d0;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:900;margin:0 auto 13px;width:max-content}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.3}}
.scanner-card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:15px;box-shadow:0 12px 34px rgba(4,57,112,.09)}
.scanner-title{text-align:center;font-size:20px;font-weight:950;margin:2px 0 4px}.scanner-hint{text-align:center;color:var(--muted);font-size:13px;margin:0 0 12px}
#reader{width:100%;min-height:310px;border-radius:16px;overflow:hidden;background:#071a2d;display:flex;align-items:center;justify-content:center}
#reader video{object-fit:cover!important;border-radius:16px}
.camera-msg{color:#fff;font-size:13px;text-align:center;padding:30px}
.secondary{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:12px;font-weight:850;margin-top:11px}
.result{display:none;margin-top:14px;border-radius:17px;padding:15px;border:1px solid}
.result.show{display:block}.result.success{background:#dcfce7;border-color:#86efac;color:#14532d}.result.error{background:#fee2e2;border-color:#fca5a5;color:#7f1d1d}.result.warning{background:#fef3c7;border-color:#fcd34d;color:#78350f}
.result-kicker{font-size:11px;font-weight:900;letter-spacing:.08em}.result-name{font-size:19px;font-weight:950;margin:3px 0}.result-meta{font-size:13px;font-weight:650}
.history{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:14px;overflow:hidden}
.history-head{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:900;display:flex;justify-content:space-between}.history-head span{color:var(--muted);font-weight:650}
.scan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid #eef2f7}.scan-row:last-child{border:0}.scan-name{font-size:13px;font-weight:850}.scan-meta{font-size:11px;color:var(--muted);margin-top:2px}.scan-action{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#dcfce7;color:#166534}
.empty{text-align:center;color:#94a3b8;padding:24px;font-size:13px}
@media(max-width:380px){.main{padding:11px}.scanner-card{padding:11px}#reader{min-height:270px}.brand-title{font-size:17px}}
</style>
<script defer src="/static/html5-qrcode.min.js?v=1"></script>
</head>
<body>
<section id="loginView" class="login">
  <form class="login-card" onsubmit="event.preventDefault();login()">
    <div class="logo">QR</div>
    <h1>POINTEUR ATLAS</h1>
    <p class="login-sub">Pointage mobile des employés</p>
    <label for="username">Identifiant pointeur</label>
    <input id="username" autocomplete="username" autocapitalize="characters" required placeholder="PTG01 / OPS01 / SUP01">
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    <button id="loginBtn" class="primary">SE CONNECTER</button>
    <div id="loginError" class="error"></div>
  </form>
</section>

<section id="appView" class="app hidden">
  <header class="top">
    <div class="top-row">
      <div class="brand"><div class="brand-logo">QR</div><div><div class="brand-title">POINTEUR</div><div class="brand-user" id="userLabel">—</div></div></div>
      <button class="logout" onclick="logout()">Déconnexion</button>
    </div>
  </header>
  <main class="main">
    <div class="status"><span class="dot"></span> SCANNER ACTIF</div>
    <section class="scanner-card">
      <div class="scanner-title">Scannez le QR employé</div>
      <p class="scanner-hint">Présentez le QR dans le cadre. La validation est automatique.</p>
      <div id="reader"><div class="camera-msg">Ouverture de la caméra arrière…</div></div>
      <button id="restartBtn" class="secondary hidden" onclick="startScanner()">📷 RÉACTIVER LA CAMÉRA</button>
      <div id="result" class="result"></div>
    </section>
    <section class="history">
      <div class="history-head">SCANS DE CETTE SESSION <span id="scanCount">0</span></div>
      <div id="historyList"><div class="empty">Aucun QR scanné.</div></div>
    </section>
  </main>
</section>

<script>
const SESSION_KEY="atlas_pointer_session";
let pointerSession=null;
let scanner=null;
let scanBusy=false;
let sessionScans=[];

function esc(value){const d=document.createElement("div");d.textContent=String(value??"");return d.innerHTML}
function showLoginError(message){const el=document.getElementById("loginError");el.textContent=message;el.classList.toggle("show",!!message)}
async function login(){
  const button=document.getElementById("loginBtn");
  button.disabled=true;button.textContent="CONNEXION…";showLoginError("");
  try{
    const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.detail||"Connexion refusée");
    pointerSession={token:data.access_token,user:data.user};
    localStorage.setItem(SESSION_KEY,JSON.stringify(pointerSession));
    enterApp();
  }catch(error){showLoginError(error.message||"Connexion impossible")}
  finally{button.disabled=false;button.textContent="SE CONNECTER"}
}
function enterApp(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  const user=pointerSession?.user||{};
  document.getElementById("userLabel").textContent=(user.full_name||user.username||"Pointeur")+" · "+(user.username||"");
  requestAnimationFrame(startScanner);
}
async function logout(){
  await stopScanner();
  localStorage.removeItem(SESSION_KEY);pointerSession=null;sessionScans=[];
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
  document.getElementById("password").value="";
}
async function startScanner(){
  if(scanner)return;
  const reader=document.getElementById("reader");
  const restart=document.getElementById("restartBtn");
  reader.innerHTML='<div class="camera-msg">Ouverture de la caméra arrière…</div>';
  restart.classList.add("hidden");
  if(!window.Html5Qrcode){setTimeout(startScanner,250);return}
  try{
    scanner=new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"},{fps:14,qrbox:{width:250,height:250},aspectRatio:1},onQr,()=>{});
  }catch(error){
    try{
      if(scanner)await scanner.start({facingMode:"user"},{fps:12,qrbox:{width:240,height:240},aspectRatio:1},onQr,()=>{});
    }catch(secondError){
      scanner=null;reader.innerHTML='<div class="camera-msg">Caméra indisponible.<br>Autorisez la caméra dans les réglages du navigateur.</div>';
      restart.classList.remove("hidden");
    }
  }
}
async function stopScanner(){
  const active=scanner;scanner=null;
  if(active){try{await active.stop()}catch(e){}try{await active.clear()}catch(e){}}
}
async function onQr(token){
  if(scanBusy)return;
  scanBusy=true;
  try{
    const response=await fetch("/api/portal/attendance-qr/scan",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+pointerSession.token},body:JSON.stringify({token:String(token||"").trim()})});
    const data=await response.json().catch(()=>({}));
    if(response.status===401){logout();throw new Error("Session expirée")}
    if(!response.ok)throw new Error(data.detail||"Pointage refusé");
    const employee=data.employee||{};
    const entry={name:[employee.nom,employee.prenom].filter(Boolean).join(" ")||"Employé",matricule:employee.matricule||"",action:data.action||"arrivee",heure:data.heure||"",site:data.site||""};
    sessionScans.unshift(entry);sessionScans=sessionScans.slice(0,30);
    showResult(entry,"success");renderHistory();navigator.vibrate?.([80,40,80]);
  }catch(error){showResult({message:error.message||"QR invalide"},"error");navigator.vibrate?.(180)}
  finally{setTimeout(()=>{scanBusy=false},1800)}
}
function showResult(data,type){
  const el=document.getElementById("result");el.className="result show "+type;
  if(type==="success"){
    const action=data.action==="depart"?"DÉPART ENREGISTRÉ":"ARRIVÉE ENREGISTRÉE";
    el.innerHTML=`<div class="result-kicker">${action}</div><div class="result-name">${esc(data.name)}</div><div class="result-meta">${esc(data.matricule)} · ${esc(data.site||"Site non renseigné")} · ${esc(data.heure)}</div>`;
  }else el.innerHTML=`<div class="result-kicker">SCAN REFUSÉ</div><div class="result-name">${esc(data.message)}</div>`;
  clearTimeout(showResult.timer);showResult.timer=setTimeout(()=>el.classList.remove("show"),3500);
}
function renderHistory(){
  document.getElementById("scanCount").textContent=String(sessionScans.length);
  document.getElementById("historyList").innerHTML=sessionScans.length?sessionScans.map(row=>`<div class="scan-row"><div><div class="scan-name">${esc(row.name)}</div><div class="scan-meta">${esc(row.matricule)} · ${esc(row.site||"—")} · ${esc(row.heure)}</div></div><div class="scan-action">${row.action==="depart"?"DÉPART":"ARRIVÉE"}</div></div>`).join(""):'<div class="empty">Aucun QR scanné.</div>';
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopScanner();else if(pointerSession)startScanner()});
window.addEventListener("beforeunload",stopScanner);
document.addEventListener("DOMContentLoaded",()=>{
  try{pointerSession=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){pointerSession=null}
  if(pointerSession?.token)enterApp();
});
</script>
</body>
</html>
