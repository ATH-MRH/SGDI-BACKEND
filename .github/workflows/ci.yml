name: CI

on:
  push:
    branches: [main, optimisation-et-migration]
  pull_request:

# Un nouveau push sur une branche annule le run precedent encore en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Les tests sont autonomes : conftest.py force DATABASE_URL sur une base
      # SQLite locale (test_sgdi.db) et fixe tous les secrets/JWT/uploads.
      # Aucun PostgreSQL externe n'est requis.
      - name: Lancer pytest
        run: python -m pytest -q

      - name: Installer les outils de sauvegarde PostgreSQL 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Chemins de migration sans adoption et restauration isolée
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg2://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
        run: >-
          python -m pytest -q
          tests/test_pointeur_v7_migration.py
          tests/test_pointeur_v7_postgresql.py
          tests/test_central_rotation_postgresql.py

  frontend:
    name: Tests frontend (node --test + jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # jsdom est declare dans package.json (devDependencies) ; node_modules
      # est gitignore donc on l'installe ici.
      - name: Installer jsdom
        run: npm install

      - name: Lancer les tests frontend
        env:
          ATLAS_V7_ARTIFACTS: ${{ runner.temp }}/pointeur-v7-captures
          ATLAS_CENTRAL_ARTIFACTS: ${{ runner.temp }}/central-rotations-captures
        run: npm test

      - name: Conserver les captures Pointeur V7 (données fictives)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pointeur-v7-captures
          path: ${{ runner.temp }}/pointeur-v7-captures
          if-no-files-found: error

      - name: Conserver les captures du composant OPS (données fictives)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-rotations-captures
          path: ${{ runner.temp }}/central-rotations-captures
          if-no-files-found: error

  mobile:
    name: Application mobile IRON Emploi (tests, typecheck, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/recruitment
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/recruitment/package-lock.json

      - name: Installer les dependances
        run: npm ci --no-audit --no-fund

      - name: Tests (contrat d'API, profil, filtres)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  docker:
    name: Construction de l'image Docker (comme Coolify, sans publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Meme Dockerfile que le deploiement : export web IRON Emploi, controle JS,
      # modeles biometriques verifies, compileall. Aucune image n'est poussee.
      - name: Construire l'image
        run: docker build --pull -t atlas-ci:${{ github.sha }} .
